  <!-- Text Label -->
  <text x="400" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#6b7280" text-anchor="middle">
    FLAVOUR &amp; CO.
  </text>
